<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendEase | Employee Attendance Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --present: #16a34a;
      --absent: #dc2626;
      --late: #d97706;
      --present-bg: #dcfce7;
      --absent-bg: #fee2e2;
      --late-bg: #fef3c7;
      --radius: 12px;
      --transition: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    .wrap { max-width: 980px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

    /* Header */
    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.88rem; margin-top: 0.2rem; }

    /* Stats summary */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      border: 1px solid var(--border);
    }
    .stat-card .label { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-card .value { font-size: 1.9rem; font-weight: 800; margin-top: 0.3rem; }
    .stat-card.total .value { color: var(--ink); }
    .stat-card.present .value { color: var(--present); }
    .stat-card.absent .value { color: var(--absent); }
    .stat-card.late .value { color: var(--late); }
    .stat-card .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

    /* Controls bar */
    .controls {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }
    .filter-chip-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-chip {
      padding: 0.45rem 0.95rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all var(--transition);
    }
    .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    .date-display { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-left: auto; }

    /* Employee table */
    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .emp-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .emp-row:last-child { border-bottom: none; }
    .emp-row:hover { background: #fafafa; }
    .emp-row.head { background: #f9fafb; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 0.7rem 1.25rem; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .emp-info .name { font-weight: 600; font-size: 0.92rem; }
    .emp-info .dept { font-size: 0.78rem; color: var(--muted); }

    .status-group { display: flex; gap: 0.4rem; align-items: center; }
    .status-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
      transition: all var(--transition);
    }
    .status-btn:hover { border-color: var(--primary); }
    .status-btn.present.active { background: var(--present-bg); color: var(--present); border-color: var(--present); }
    .status-btn.absent.active { background: var(--absent-bg); color: var(--absent); border-color: var(--absent); }
    .status-btn.late.active { background: var(--late-bg); color: var(--late); border-color: var(--late); }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-left: 0.5rem;
      white-space: nowrap;
    }
    .status-badge.present { background: var(--present-bg); color: var(--present); }
    .status-badge.absent { background: var(--absent-bg); color: var(--absent); }
    .status-badge.late { background: var(--late-bg); color: var(--late); }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 0.9rem; }

    footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 2rem; }

    @media (max-width: 600px) {
      .emp-row { grid-template-columns: 36px 1fr; row-gap: 0.6rem; }
      .status-group { grid-column: 1 / -1; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>📋 AttendEase</h1>
    <p>Employee attendance dashboard — mark and track daily attendance</p>
  </header>

  <!-- Summary stats -->
  <section class="stats-grid">
    <div class="stat-card total">
      <div class="label">Total employees</div>
      <div class="value js-stat-total">0</div>
    </div>
    <div class="stat-card present">
      <div class="label">Present</div>
      <div class="value js-stat-present">0</div>
      <div class="sub js-stat-present-pct">0% attendance</div>
    </div>
    <div class="stat-card absent">
      <div class="label">Absent</div>
      <div class="value js-stat-absent">0</div>
    </div>
    <div class="stat-card late">
      <div class="label">Late</div>
      <div class="value js-stat-late">0</div>
    </div>
  </section>

  <!-- Controls -->
  <section class="controls">
    <input class="search-input js-search" type="text" placeholder="Search employee by name..." />
    <div class="filter-chip-row js-filter-row"></div>
    <span class="date-display js-today"></span>
  </section>

  <!-- Employee table -->
  <section class="table-card">
    <div class="emp-row head">
      <span></span>
      <span>Employee</span>
      <span>Mark attendance</span>
    </div>
    <div class="js-emp-list"></div>
  </section>

  <footer>Built with Vanilla JS · DOM Manipulation · AttendEase Dashboard</footer>

</div>

<script>
  /* ============================================================
     STATE
  ============================================================ */
  let employees = [
    { id: 1, name: "Abinaya",   dept: "Accountant", status: "present" },
    { id: 2, name: "Priya ",     dept: "Engineering",       status: "present" },
    { id: 3, name: "Shruthi",    dept: "Marketing",    status: "absent"  },
    { id: 4, name: "Tajesh",     dept: "Engineering",  status: "late"    },
    { id: 5, name: "Varshana",  dept: "Sales",        status: "present" },
    { id: 6, name: "Varshini",   dept: "HR",           status: "absent"  },
    { id: 7, name: "Vikram ",   dept: "Engineering",  status: "present" },
    { id: 8, name: "Dharshini",   dept: "Design",       status: "late"    }
  ];

  let activeFilter = "all";
  let searchTerm = "";

  const filters = [
    { key: "all",     label: "All" },
    { key: "present", label: "Present" },
    { key: "absent",  label: "Absent" },
    { key: "late",    label: "Late" }
  ];

  /* ============================================================
     DOM REFS
  ============================================================ */
  const empList      = document.querySelector('.js-emp-list');
  const filterRow     = document.querySelector('.js-filter-row');
  const searchInput   = document.querySelector('.js-search');
  const todayDisplay  = document.querySelector('.js-today');

  const statTotal      = document.querySelector('.js-stat-total');
  const statPresent    = document.querySelector('.js-stat-present');
  const statPresentPct = document.querySelector('.js-stat-present-pct');
  const statAbsent     = document.querySelector('.js-stat-absent');
  const statLate       = document.querySelector('.js-stat-late');

  /* ============================================================
     HELPERS
  ============================================================ */
  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function renderToday() {
    const today = new Date();
    todayDisplay.textContent = today.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  /* ============================================================
     RENDER STATS
  ============================================================ */
  function renderStats() {
    const total = employees.length;
    const present = employees.filter(e => e.status === 'present').length;
    const absent = employees.filter(e => e.status === 'absent').length;
    const late = employees.filter(e => e.status === 'late').length;
    const pct = total === 0 ? 0 : Math.round((present / total) * 100);

    statTotal.textContent = total;
    statPresent.textContent = present;
    statPresentPct.textContent = pct + '% attendance';
    statAbsent.textContent = absent;
    statLate.textContent = late;
  }

  /* ============================================================
     RENDER FILTER CHIPS
  ============================================================ */
  function renderFilters() {
    filterRow.innerHTML = '';
    filters.forEach((f) => {
      const chip = document.createElement('button');
      chip.className = 'filter-chip js-filter-chip' + (f.key === activeFilter ? ' active' : '');
      chip.textContent = f.label;
      chip.dataset.key = f.key;
      filterRow.appendChild(chip);
    });
  }

  filterRow.addEventListener('click', (e) => {
    const chip = e.target.closest('.js-filter-chip');
    if (!chip) return;
    activeFilter = chip.dataset.key;
    renderFilters();
    renderEmployeeList();
  });

  /* ============================================================
     SEARCH
  ============================================================ */
  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderEmployeeList();
  });

  /* ============================================================
     RENDER EMPLOYEE LIST
     IPO: filter/search state -> compute visible list -> build DOM rows
  ============================================================ */
  function renderEmployeeList() {
    empList.innerHTML = '';

    let visible = employees;

    if (activeFilter !== 'all') {
      visible = visible.filter(e => e.status === activeFilter);
    }
    if (searchTerm) {
      visible = visible.filter(e => e.name.toLowerCase().includes(searchTerm));
    }

    if (visible.length === 0) {
      empList.innerHTML = '<div class="empty-state">No employees match your search or filter.</div>';
      return;
    }

    visible.forEach((emp) => {
      const row = document.createElement('div');
      row.className = 'emp-row';
      row.dataset.id = emp.id;

      row.innerHTML = `
        <div class="avatar">${getInitials(emp.name)}</div>
        <div class="emp-info">
          <div class="name">${emp.name} <span class="status-badge ${emp.status}">${emp.status}</span></div>
          <div class="dept">${emp.dept}</div>
        </div>
        <div class="status-group">
          <button class="status-btn present js-status-btn ${emp.status === 'present' ? 'active' : ''}" data-status="present">Present</button>
          <button class="status-btn late js-status-btn ${emp.status === 'late' ? 'active' : ''}" data-status="late">Late</button>
          <button class="status-btn absent js-status-btn ${emp.status === 'absent' ? 'active' : ''}" data-status="absent">Absent</button>
        </div>
      `;
      empList.appendChild(row);
    });
  }

  /* ============================================================
     STATUS UPDATE — event delegation on the list container
     IPO: click status btn -> mutate employee state -> re-render
  ============================================================ */
  empList.addEventListener('click', (e) => {
    const btn = e.target.closest('.js-status-btn');
    if (!btn) return;

    const row = btn.closest('.emp-row');
    const id = Number(row.dataset.id);
    const newStatus = btn.dataset.status;

    employees = employees.map(emp =>
      emp.id === id ? { ...emp, status: newStatus } : emp
    );

    renderStats();
    renderEmployeeList();
  });

  /* ============================================================
     INIT
  ============================================================ */
  renderToday();
  renderFilters();
  renderStats();
  renderEmployeeList();
</script>

</body>
</html>
